name: Uptime & Health Monitor

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to probe (defaults to configured Render service URL)'
        required: false
        default: ''

jobs:
  health-check:
    name: Probe Health Endpoint
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Determine Health Check URL
        id: config
        run: |
          TARGET="${{ github.event.inputs.target_url || vars.RENDER_APP_URL || 'https://interactive-hero-app.onrender.com' }}"
          # Ensure ends with /health
          TARGET="${TARGET%/}/health"
          echo "url=$TARGET" >> $GITHUB_OUTPUT
          echo "Probing endpoint: $TARGET"

      - name: Execute Health Probe
        id: probe
        run: |
          PROBE_URL="${{ steps.config.outputs.url }}"
          START_TIME=$(date +%s%N)
          
          # Use 45s max-time and retry to accommodate Render Free Tier container cold starts
          HTTP_RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}" "$PROBE_URL" --max-time 45 --retry 2 --retry-delay 3 || echo "CURL_FAILED")
          
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '/HTTP_STATUS:/,$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          TIME_TOTAL=$(echo "$HTTP_RESPONSE" | grep "TIME_TOTAL:" | cut -d':' -f2)
          
          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"
          echo "Latency: ${TIME_TOTAL}s"
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "health_status=UP" >> $GITHUB_OUTPUT
            echo "latency=$TIME_TOTAL" >> $GITHUB_OUTPUT
            echo "✅ Health check passed with status 200 (Latency: ${TIME_TOTAL}s)"
          else
            echo "health_status=DOWN" >> $GITHUB_OUTPUT
            echo "http_status=$HTTP_STATUS" >> $GITHUB_OUTPUT
            echo "response_body=$HTTP_BODY" >> $GITHUB_OUTPUT
            echo "❌ Health check failed with status: $HTTP_STATUS"
            exit 1
          fi

      - name: Alert Maintainers on Outage
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const probeUrl = '${{ steps.config.outputs.url }}';
            const issueTitle = `🚨 Uptime Alert: Service Health Check Failed`;
            const issueBody = `### 🚨 Production Incident Detected\n\n` +
              `- **Target Endpoint**: \`${probeUrl}\`\n` +
              `- **Timestamp**: ${new Date().toISOString()}\n` +
              `- **Workflow Run**: [View GitHub Actions Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `### Diagnostic Details\n` +
              `The automated health probe failed to receive a \`200 OK\` response within the 10-second timeout window.\n\n` +
              `### Immediate Actions Required\n` +
              `1. Check Render service logs in the Render Dashboard.\n` +
              `2. Inspect recent commits and deployments.\n` +
              `3. Verify container health status and resource usage.\n\n` +
              `_This incident was automatically generated by the Uptime & Health Monitor workflow._`;
            
            // Check if open incident issue already exists to avoid spamming
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident'
            });
            
            if (issues.data.length > 0) {
              const existingIssue = issues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `**Recurring Outage Alert** at ${new Date().toISOString()}:\n\nEndpoint \`${probeUrl}\` is still unreachable.`
              });
              console.log(`Updated existing incident issue #${existingIssue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['incident', 'uptime-alert']
              });
              console.log(`Created new incident issue #${newIssue.data.number}`);
            }

      - name: Auto-resolve Open Incidents on Recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const probeUrl = '${{ steps.config.outputs.url }}';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'incident'
            });

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `### 🟢 Service Health Restored\n\n` +
                  `- **Endpoint**: \`${probeUrl}\`\n` +
                  `- **Recovery Timestamp**: ${new Date().toISOString()}\n` +
                  `- **Latency**: ${{ steps.probe.outputs.latency }}s\n` +
                  `- **Workflow Run**: [View GitHub Actions Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
                  `Automated health probes confirmed \`HTTP 200 OK\`. Resolving incident automatically.`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });

              console.log(`Auto-resolved incident #${issue.number}`);
            }
