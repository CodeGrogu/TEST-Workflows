<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Studio — Next-Gen Interactive Experience</title>
  <meta name="description" content="Next-generation interactive cybernetic canvas, particle physics synthesizer, and dynamic visual playground.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow layers -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- Interactive Canvas Particle Layer -->
  <canvas id="bg-canvas"></canvas>

  <!-- Cursor Spotlight & Follower -->
  <div id="cursor-glow" class="cursor-glow"></div>

  <!-- Top Navigation & Telemetry HUD -->
  <header class="hud-header">
    <div class="brand-badge">
      <span class="status-indicator"></span>
      <span class="brand-title">QUANTUM.IO</span>
      <span class="badge-tag">v2.0 PRO</span>
    </div>

    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span class="telemetry-label">FPS</span>
        <span class="telemetry-val" id="hud-fps">60</span>
      </div>
      <div class="telemetry-divider"></div>
      <div class="telemetry-item">
        <span class="telemetry-label">PARTICLES</span>
        <span class="telemetry-val" id="hud-particles">120</span>
      </div>
      <div class="telemetry-divider"></div>
      <div class="telemetry-item">
        <span class="telemetry-label">SYSTEM</span>
        <span class="telemetry-val status-up" id="hud-status">HEALTHY</span>
      </div>
    </div>
  </header>

  <!-- Main Interactive Hero Stage -->
  <main class="stage" id="stage">
    <div class="card-wrapper" id="card-wrapper">
      <div class="glass-card" id="glass-card">
        <!-- Accent decorative ring & reflections -->
        <div class="card-border-glow"></div>
        <div class="glass-reflection"></div>
        
        <div class="card-header-meta">
          <span class="card-eyebrow">HOLOGRAPHIC QUANTUM RUNTIME</span>
          <div class="audio-visualizer-mini" id="audio-mini-bars">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </div>
        </div>

        <!-- Kinetic Interactive Text -->
        <div class="text-container">
          <h1 class="hero-text" id="hero-text" data-text="Hello World">
            <span class="letter">H</span><span class="letter">e</span><span class="letter">l</span><span class="letter">l</span><span class="letter">o</span>
            <span class="space">&nbsp;</span>
            <span class="letter">W</span><span class="letter">o</span><span class="letter">r</span><span class="letter">l</span><span class="letter">d</span>
          </h1>
        </div>

        <p class="hero-subtitle">
          Interactive particle mesh • Neural audio synthesizer • Ultra-low latency canvas
        </p>

        <!-- Interactive Action Quick Buttons -->
        <div class="hero-actions">
          <button class="btn btn-primary" id="btn-burst">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            Trigger Supernova
          </button>
          <button class="btn btn-secondary" id="btn-audio-toggle">
            <svg class="btn-icon" id="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <span id="audio-btn-text">Audio Synth: ON</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Interactive Control Deck (Bottom Floating HUD) -->
  <footer class="control-deck">
    <!-- Visual Particle Engine Modes -->
    <div class="control-group">
      <span class="control-group-title">VISUAL ENGINE</span>
      <div class="segmented-control" role="tablist">
        <button class="segment active" data-mode="constellation" role="tab">Quantum Net</button>
        <button class="segment" data-mode="matrix" role="tab">Matrix Stream</button>
        <button class="segment" data-mode="vortex" role="tab">Vortex Warp</button>
      </div>
    </div>

    <!-- Theme Palette Selector -->
    <div class="control-group">
      <span class="control-group-title">COLOR AURA</span>
      <div class="theme-palette-picker">
        <button class="theme-chip active" data-theme="neon" title="Cyber Neon" style="--chip-c1: #00f0ff; --chip-c2: #ff007f;"></button>
        <button class="theme-chip" data-theme="violet" title="Galactic Violet" style="--chip-c1: #a855f7; --chip-c2: #3b82f6;"></button>
        <button class="theme-chip" data-theme="solar" title="Solar Flare" style="--chip-c1: #ff7e5f; --chip-c2: #feb47b;"></button>
        <button class="theme-chip" data-theme="matrix" title="Emerald Grid" style="--chip-c1: #00ff88; --chip-c2: #006633;"></button>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
